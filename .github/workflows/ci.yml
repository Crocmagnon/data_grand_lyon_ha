name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Run checks
        run: uvx prek run --all-files

      - name: Build package
        run: uv build
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Publish to PyPI
        run: uv publish
        if: startsWith(github.ref, 'refs/tags/v')
