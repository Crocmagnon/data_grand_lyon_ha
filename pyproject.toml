[project]
name = "transports-commun-lyon"
version = "0.0.1"
description = "Python library to retrieve public transport data from the TCL/Sytral network in Lyon, France"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Gabriel Augendre" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
