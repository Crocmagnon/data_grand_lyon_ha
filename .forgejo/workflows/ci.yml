name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: codeberg-tiny
    steps:
      - uses: https://github.com/actions/checkout@v6.0.2

      - uses: https://github.com/astral-sh/setup-uv@v8.0.0

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Publish to PyPI
        run: uv publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
